  function crumb(){ var spans=[].slice.call(document.querySelectorAll('span')); return spans.map(function(s){return s.textContent.trim();}); }
  function hasCrumb(t){ return crumb().some(function(s){return s===t;}); }
  function ensureGrButton(){
    if(document.getElementById('gr-nav-btn')) return;
    // Add a Grievance Portal button next to the header search / top-right area
    var header=document.querySelector('header'); if(!header) return;
    var btn=document.createElement('button'); btn.id='gr-nav-btn';
    btn.textContent='⚠️ Grievance Portal';
    btn.style.cssText='height:36px;padding:0 14px;border-radius:999px;background:#C62828;color:#fff;font-weight:700;font-size:12px;border:none;cursor:pointer;white-space:nowrap';
    btn.title='Open Grievance Portal — patient complaints';
    btn.addEventListener('click',function(){ window.__grievanceOpen=true; openGrievance(); });
    header.appendChild(btn);
  }
  function openGrievance(){
    var old=document.getElementById('gr-panel'); if(old){ old.scrollIntoView({behavior:'smooth'}); return; }
    var sections=[].slice.call(document.querySelectorAll('section'));
    var target=sections[0]; if(!target) return;
    var panel=makeGrPanel(); target.parentNode.insertBefore(panel,target); grRender();
    // Hide other panels if present
    ['tele-panel','fu-panel','ref-panel'].forEach(function(id){var p=document.getElementById(id); if(p) p.remove();});
  }
  function tick(){
    ensureGrButton();
    // If grievance was opened, keep it and don't auto-remove
    if(window.__grievanceOpen && document.getElementById('gr-panel')) return;
    if(window.__grievanceOpen && !document.getElementById('gr-panel')){ window.__grievanceOpen=false; }
    // Follow Up page
    if(hasCrumb('Follow Up')){
      if(!document.getElementById('fu-panel')){
        var secs=[].slice.call(document.querySelectorAll('section'));
        var t=secs.find(function(s){return s.textContent.includes('Patient Filters');})||secs[0];
        if(t){ var p=makeFuPanel(); t.parentNode.insertBefore(p,t); fuRender(); }
      }
      return;
    }
    var fu=document.getElementById('fu-panel'); if(fu) fu.remove();
    // Referral page
    if(hasCrumb('Referral Management')){
      if(!document.getElementById('ref-panel')){
        var secs2=[].slice.call(document.querySelectorAll('section'));
        var t2=secs2.find(function(s){return s.textContent.includes('Patient Filters');})||secs2[0];
        if(t2){ var p2=makeRefPanel(); t2.parentNode.insertBefore(p2,t2); refRender(); }
      }
      return;
    }
    var rf=document.getElementById('ref-panel'); if(rf) rf.remove();
  }
  setInterval(tick,700);
})();
</script>

      +'<div style="display:flex;justify-content:space-between;gap:16px;margin-top:22px;font-size:12px;color:#475569"><div style="text-align:center"><div style="font-family:cursive;font-size:18px;color:#0F172A">'+esc(tech)+'</div><div>Lab Technician</div><div>Signature & Seal</div></div><div style="text-align:center"><div style="font-family:cursive;font-size:18px;color:#0F172A">'+esc(doctor.split("—")[0])+'</div><div>Examining Doctor</div><div>Signature & Seal</div></div><div style="text-align:center"><div style="width:70px;height:70px;border:2px dashed #2E7D32;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#2E7D32;font-weight:800;font-size:11px;text-align:center;margin:0 auto">VERIFIED<br>MMU LAB</div><div style="margin-top:4px">Electronically verified</div></div></div>'
      +'<p style="font-size:11px;color:#94A3B8;margin-top:16px;border-top:1px dashed #E2E8F0;padding-top:8px">This is a system-generated report from the MMU Laboratory. Values are for clinical correlation only — please consult the treating doctor. For any discrepancy, contact the MMU / District NHM office with Report ID '+esc(reportId)+'.</p>'
      +'</div>'
      +'<div style="padding:14px 22px;background:#F8FAFC;display:flex;justify-content:space-between;gap:10px"><button id="lab-back" style="height:36px;padding:0 18px;border-radius:999px;background:#0D47A1;color:#fff;border:none;font-weight:600;font-size:13px;cursor:pointer">← Back to Line List</button><span style="font-size:12px;color:#64748B;align-self:center">Report ID: '+esc(reportId)+' • Patient: '+esc(p.name)+'</span></div>'
      +'</div>';
    document.body.appendChild(overlay);
    var close=function(){overlay.remove();};
    overlay.querySelector('#lab-close').addEventListener('click',close);
    overlay.querySelector('#lab-back').addEventListener('click',close);
    overlay.addEventListener('click',function(e){ if(e.target===overlay) close(); });
    document.addEventListener('keydown',function h(e){ if(e.key==='Escape'){close(); document.removeEventListener('keydown',h);} });
  }
  function isPatientPage(){
    var ths=[].slice.call(document.querySelectorAll('th'));
    return ths.some(function(t){return t.textContent.trim()==='Patient ID';});
  }
  function tick(){
    if(!isPatientPage()) return;
    var rows=[].slice.call(document.querySelectorAll('tbody tr'));
    rows.forEach(function(row){
      var cells=row.querySelectorAll('td'); if(cells.length<10) return;
      var actionsCell=cells[cells.length-1];
      if(!actionsCell || actionsCell.querySelector('.lab-report-btn')) return;
      var container=actionsCell.querySelector('div')||actionsCell;
      var btn=document.createElement('button');
      btn.className='lab-report-btn';
      btn.type='button';
      btn.title='View Lab Report';
      btn.textContent='🧪';
      btn.style.cssText='width:28px;height:28px;border-radius:50%;background:#E0F2F1;color:#00695C;border:1px solid #B2DFDB;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0';
      btn.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); openReport(row); });
      container.appendChild(btn);
    });
    // Add "Report" header hint on Actions column
    var ths=[].slice.call(document.querySelectorAll('th'));
    var act=ths.find(function(t){return t.textContent.trim()==='Actions';});
    if(act && !act.dataset.labHint){ act.dataset.labHint='1'; act.textContent='Actions (🧪 = Lab Report)'; }
  }
  setInterval(tick,700);
  // Print: only the report sheet
  var st=document.createElement('style');
  st.textContent='@media print{ body *{visibility:hidden !important} #lab-report-overlay, #lab-report-overlay *{visibility:visible !important} #lab-report-overlay{position:static !important;background:#fff !important;padding:0 !important} #lab-close, #lab-back{ display:none !important } }';
  document.head.appendChild(st);
})();
</script>

<script>
(function(){

  function hash(str){var h=0;for(var i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return Math.abs(h);}
  function fmtTime(min){var hh=Math.floor(min/60), mm=min%60; var ap=hh>=12?'PM':'AM'; var h12=hh%12||12; return String(h12).padStart(2,'0')+':'+String(mm).padStart(2,'0')+' '+ap;}
  function openTripDetail(row){
    var c=row.querySelectorAll('td'); if(c.length<12) return;
    var t=function(i){return (c[i]&&c[i].textContent||'').trim();};
    var vehicle=t(0), date=t(1), route=t(2), dep=t(3), arr=t(4), dist=t(5), dur=t(6), camps=t(7), patients=t(8), fuel=t(9), driver=t(10), status=t(11);
    var seed=hash(vehicle+date+route);
    var stops=route.split('→').map(function(s){return s.trim();});
    // Build timeline: departure from HQ, halt at each intermediate + final camp, return
    var depMin=7*60+40+(seed%40); // ~07:40-08:20
    var totalMin=420+(seed%180);
    var timeline=[];
    timeline.push({time:fmtTime(depMin), title:'Departed — '+stops[0], desc:'Vehicle left base. Driver '+driver+' • Odometer start • Fuel check done • Medicine / lab stock loaded • GPS tracking ON.', tag:'DEPARTURE', color:'#0D47A1'});
    var cur=depMin;
    for(var i=1;i<stops.length;i++){
      var leg=Math.round(totalMin/(stops.length+1));
      cur+=leg;
      var halt=60+(seed%(40+i*13))%50;
      var pats = i===stops.length-1 ? patients : String(60+((seed+i*37)%90));
      var isFinal=i===stops.length-1;
      timeline.push({time:fmtTime(cur), title:(isFinal?'Reached Final Camp — ':'Reached Halt — ')+stops[i], desc:'Arrived after '+leg+' min drive. '+(isFinal?'Camp set up, OPD started. Patients registered: '+pats+'. Lab tests, medicines dispensed, ABHA / teleconsult as needed.':'Halt for camp / patient queue. Patients seen at this halt: '+pats+'.'), tag:isFinal?'CAMP':'HALT', color:isFinal?'#2E7D32':'#EF6C00'});
      cur+=halt;
      if(!isFinal) timeline.push({time:fmtTime(cur), title:'Left — '+stops[i], desc:'Halt over after '+halt+' min. Next leg to '+(stops[i+1]||'base')+'. Fuel / tyre check OK.', tag:'MOVED', color:'#64748B'});

    var prev=[

    if(vehicle==='CG-04-MMU-034'){ prev=[['17 Nov 2026','Previous trip • 118 km • 2 camps • 203 patients • Completed'],['16 Nov 2026','Previous trip • 101 km • 2 camps • 169 patients • Completed'],['15 Nov 2026','Previous trip • 89 km • 1 camp • 134 patients • Completed']]; }

      +'<div><span style="color:#64748B">Driver</span><br><b>'+esc(driver)+'</b></div><div><span style="color:#64748B">Departed → Arrived</span><br><b>'+esc(dep)+' → '+esc(arr)+'</b></div><div><span style="color:#64748B">Distance / Duration</span><br><b>'+esc(dist)+' • '+esc(dur)+'</b></div><div><span style="color:#64748B">Camps / Patients / Fuel</span><br><b>'+esc(camps)+' / '+esc(patients)+' / '+esc(fuel)+'</b></div><div><span style="color:#64748B">Trip Status</span><br><b>'+esc(status)+'</b></div><div><span style="color:#64748B">Avg Speed (est.)</span><br><b>'+Math.round(parseInt(dist)||90)/Math.max(1,Math.round((totalMin)/60))+' km/h • Max ~62 km/h</b></div>'

<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function hash(str){var h=0;for(var i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return Math.abs(h);}
  function fmt(min){var hh=Math.floor(min/60),mm=min%60,ap=hh>=12?'PM':'AM',h12=hh%12||12;return String(h12).padStart(2,'0')+':'+String(mm).padStart(2,'0')+' '+ap;}
  // Routes per district / vehicle — deterministic so same vehicle always shows same history
  var ROUTES={
    'Kanker':['Kanker HQ','Kanker Haat Bazaar','Antagarh','Bhanupratappur'],
    'Bastar':['Bastar HQ','Lohandiguda','Tokapal','Bastanar'],
    'Dantewada':['Dantewada HQ','Katekalyan','Kuakonda','Geedam'],
    'Bijapur':['Bijapur HQ','Bhairamgarh','Usoor','Bhopalpatnam'],
    'Surguja':['Surguja HQ','Ambikapur','Lundra','Mainpat'],
    'Jashpur':['Jashpur HQ','Kunkuri','Pathalgaon','Bagicha'],
    'Koriya':['Koriya HQ','Baikunthpur','Khadgawan','Sonhat'],
    'Balrampur':['Balrampur HQ','Wadrafnagar','Rajpur','Kusmi']
  };
  function openFocusedHistory(card){
    // Focused Vehicle card: vehicle id is the mono bold <p>, driver/district/speed in the small cards
    var vid='CG-04-MMU-001', driver='—', district='Kanker', speedStatus='—', lastLoc='—';
    var ps=[].slice.call(card.querySelectorAll('p'));
    for(var i=0;i<ps.length;i++){ var t=ps[i].textContent.trim(); if(/^CG-04-MMU-\d+/.test(t)) vid=t; }
    var txt=card.textContent;
    var dm=txt.match(/Driver\s*([A-Z][A-Za-z .]+)/); if(dm) driver=dm[1].trim();
    // district is the small opacity text under driver — take first known district name in card
    Object.keys(ROUTES).forEach(function(d){ if(txt.indexOf(d)>-1) district=d; });
    var sm=txt.match(/Speed \/ Status\s*([^\n]+)/); if(sm) speedStatus=sm[1].trim();
    var lm=txt.match(/Last Location|Last Known|Location\s*([A-Z][A-Za-z ,\-]+)/); 
    var seed=hash(vid);
    var route=ROUTES[district]||ROUTES['Kanker'];
    var days=[['18 Nov 2026','Today'],['17 Nov 2026','Yesterday'],['16 Nov 2026',''],['15 Nov 2026',''],['14 Nov 2026',''],['13 Nov 2026',''],['12 Nov 2026','']];
    var trips=days.map(function(d,idx){
      var dist=84+((seed+idx*23)%60); var pats=128+((seed+idx*37)%110); var fuel=Math.round(dist/6.1);
      var depMin=7*60+30+((seed+idx*11)%50); var durMin=540+((seed+idx*19)%120);
      var r=route.slice(0,3).join(' → '); if(idx%3===1) r=route.slice(0,2).join(' → ')+' → '+route[3];
      var status= idx===0 ? 'Completed — Returned' : idx===3 && vid.indexOf('045')>-1 ? 'Breakdown — Returned Early' : 'Completed — Returned';
      return {date:d[0], label:d[1], route:r, dep:fmt(depMin), arr:fmt(depMin+durMin), dist:dist+' km', dur:Math.floor(durMin/60)+'h '+(durMin%60)+'m', camps: idx%3===1?1:2, patients:pats, fuel:fuel+' L', status:status};
    });
    var latest=trips[0];
    // Timeline for latest trip
    var stops=latest.route.split('→').map(function(s){return s.trim();});
    var cur=7*60+30+((seed)%50); var tl=[];
    tl.push({time:fmt(cur), title:'Departed — '+stops[0], desc:'Left base. Driver '+driver+' • Odometer + fuel check • Medicine / lab stock loaded • GPS tracking ON.'});
    for(var i=1;i<stops.length;i++){
      var leg=55+((seed+i*29)%50); cur+=leg;
      var patsAt=50+((seed+i*41)%90);
      tl.push({time:fmt(cur), title:'Reached — '+stops[i], desc:'Arrived after '+leg+' min drive. Camp set up, OPD started. Patients seen at this halt: '+patsAt+'.'});
      var halt=65+((seed+i*17)%55); cur+=halt;
      if(i<stops.length-1) tl.push({time:fmt(cur), title:'Left — '+stops[i], desc:'Halt over after '+halt+' min. Moved to next location: '+stops[i+1]+'.'});
    }
    tl.push({time:fmt(cur+40), title:'Returned to Base — '+stops[0], desc:'Trip completed. Total '+latest.dist+', '+latest.dur+', '+latest.camps+' camps, '+latest.patients+' patients, '+latest.fuel+' fuel. Stock reconciled, report submitted.'});
    var tlHtml=tl.map(function(e){return '<div style="display:flex;gap:12px;padding:9px 0;border-left:3px solid #0D47A1;padding-left:14px"><div style="min-width:78px;font-weight:700;font-size:12px">'+e.time+'</div><div><div style="font-weight:700;font-size:13px">'+esc(e.title)+'</div><div style="font-size:12px;color:#475569">'+esc(e.desc)+'</div></div></div>';}).join('');
    var rows=trips.map(function(tr,idx){
      var badge=tr.status.indexOf('Breakdown')>-1?'background:#FFEBEE;color:#C62828':'background:#E8F5E9;color:#2E7D32';
      return '<tr style="border-top:1px solid #F1F5F9;'+(idx===0?'background:#E3F2FD':'')+'"><td style="padding:9px 10px;white-space:nowrap"><b>'+tr.date+'</b>'+(tr.label?' <span style="color:#0D47A1;font-size:11px">'+tr.label+'</span>':'')+'</td><td style="padding:9px 10px">'+esc(tr.route)+'</td><td style="padding:9px 10px;white-space:nowrap">'+tr.dep+'</td><td style="padding:9px 10px;white-space:nowrap">'+tr.arr+'</td><td style="padding:9px 10px;font-weight:700">'+tr.dist+'</td><td style="padding:9px 10px">'+tr.dur+'</td><td style="padding:9px 10px">'+tr.camps+'</td><td style="padding:9px 10px;font-weight:700">'+tr.patients+'</td><td style="padding:9px 10px">'+tr.fuel+'</td><td style="padding:9px 10px"><span style="padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;'+badge+'">'+tr.status+'</span></td></tr>';
    }).join('');

      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;background:#0F172A;color:#fff"><div><p style="font-size:11px;opacity:.7;letter-spacing:2px;font-weight:700">FOCUSED VEHICLE • TRACK HISTORY</p><h2 style="font-size:18px;font-weight:800;margin-top:4px">'+esc(vid)+' — Past History</h2><p style="font-size:12px;opacity:.85">Driver: '+esc(driver)+' • District: '+esc(district)+' • '+esc(speedStatus)+'</p></div><button id="fh-close" style="width:34px;height:34px;border-radius:50%;background:#fff;border:none;font-size:17px;cursor:pointer">✕</button></div>'
      +'<div style="padding:16px 20px">'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;font-size:12px"><div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:10px"><div style="color:#94A3B8;font-weight:700;font-size:11px">LAST 7 DAYS</div><div style="font-size:18px;font-weight:800">7 trips</div><div style="color:#64748B">All trips for this vehicle</div></div><div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:10px"><div style="color:#94A3B8;font-weight:700;font-size:11px">TOTAL DISTANCE</div><div style="font-size:18px;font-weight:800">'+trips.reduce(function(a,t){return a+parseInt(t.dist);},0)+' km</div><div style="color:#64748B">In 7 days</div></div><div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:10px"><div style="color:#94A3B8;font-weight:700;font-size:11px">PATIENTS SEEN</div><div style="font-size:18px;font-weight:800">'+trips.reduce(function(a,t){return a+t.patients;},0)+'</div><div style="color:#64748B">Across 7 trips</div></div><div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:10px"><div style="color:#94A3B8;font-weight:700;font-size:11px">CAMPS COVERED</div><div style="font-size:18px;font-weight:800">'+trips.reduce(function(a,t){return a+t.camps;},0)+' camps</div><div style="color:#64748B">Haat Bazaar camps</div></div></div>'
      +'<h3 style="font-size:14px;font-weight:800;color:#0D47A1;margin-top:18px;border-bottom:1px solid #E2E8F0;padding-bottom:6px">⏱️ Latest Trip — When It Moved to Each Location (18 Nov 2026)</h3><div style="margin-top:6px">'+tlHtml+'</div>'
      +'<h3 style="font-size:14px;font-weight:800;color:#0D47A1;margin-top:18px;border-bottom:1px solid #E2E8F0;padding-bottom:6px">📜 Past 7 Days — Every Trip of This Vehicle</h3>'
      +'<div style="overflow-x:auto;margin-top:8px"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:900px"><thead><tr style="background:#F8FAFC;color:#64748B;font-size:11px;text-transform:uppercase;text-align:left"><th style="padding:8px 10px">Date</th><th style="padding:8px 10px">Route (Track)</th><th style="padding:8px 10px">Departed</th><th style="padding:8px 10px">Arrived</th><th style="padding:8px 10px">Distance</th><th style="padding:8px 10px">Duration</th><th style="padding:8px 10px">Camps</th><th style="padding:8px 10px">Patients</th><th style="padding:8px 10px">Fuel</th><th style="padding:8px 10px">Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<p style="font-size:11px;color:#64748B;margin-top:10px">This history is for the <b>focused vehicle only</b> ('+esc(vid)+') — not all 75 MMUs. Pick a different vehicle from the Fleet Status List and click its Track History button again to see that vehicle’s history. Demo data — connect the GPS / trip-log API to replace these rows with real pings.</p>'
      +'</div>'
      +'<div style="padding:14px 20px;background:#F8FAFC;display:flex;justify-content:space-between"><button id="fh-back" style="height:36px;padding:0 18px;border-radius:999px;background:#0F172A;color:#fff;border:none;font-weight:600;font-size:13px;cursor:pointer">← Back to Focused Vehicle</button><span style="font-size:12px;color:#64748B;align-self:center">'+esc(vid)+' • '+esc(driver)+'</span></div>'
      +'</div>';
    document.body.appendChild(overlay);
    var close=function(){overlay.remove();};
    overlay.querySelector('#fh-close').addEventListener('click',close);
    overlay.querySelector('#fh-back').addEventListener('click',close);
    overlay.addEventListener('click',function(e){ if(e.target===overlay) close(); });
  }
  document.addEventListener('click',function(e){
    var btn=e.target.closest && e.target.closest('button');
    if(!btn || btn.textContent.trim()!=='Track History') return;
    // Only the Focused Vehicle card's button — it sits inside a card that says "Focused Vehicle"
    var card=btn.closest('div');
    var found=null;
    var el=btn;
    for(var i=0;i<8 && el;i++){ el=el.parentElement; if(el && el.textContent.indexOf('Focused Vehicle')>-1){ found=el; break; } }
    if(!found) return;
    e.preventDefault(); e.stopPropagation();
    openFocusedHistory(found);
  }, true);
  // Make the button visibly clickable
  setInterval(function(){
    var btns=[].slice.call(document.querySelectorAll('button'));
    btns.forEach(function(b){ if(b.textContent.trim()==='Track History'){ b.title='Click to see this focused vehicle\u2019s full track history — past trips, halts & timings'; } });
  },800);
})();
</script>

  function tick(){
    // Defensive: strip any NHM/PDPL logo images that may still sit in the leadership strip
    var lead=document.getElementById('leadership-bar');
    if(lead){
      var imgs=[].slice.call(lead.querySelectorAll('img[alt*="National Health Mission"], img[alt*="PDPL"]'));
      imgs.forEach(function(im){ var w=im.parentNode; if(w && w.parentNode) w.parentNode.removeChild(w); });
    }
    if(document.getElementById('logos-before-search')) return;
    var inputs=[].slice.call(document.querySelectorAll('input[placeholder*="Search patients, vehicles, ABHA"]'));
    if(!inputs.length) return;
    var searchBox=inputs[0].parentNode; // the grey pill search box
    if(!searchBox || !searchBox.parentNode) return;
    var wrap=document.createElement('div');
    wrap.id='logos-before-search';
    wrap.style.cssText='display:flex !important;align-items:center;gap:10px;flex-wrap:nowrap;';
    wrap.innerHTML=
      '<div style="text-align:center"><img src="'+NHM+'" alt="NHM logo" style="height:40px;width:auto;background:#fff;border-radius:8px;padding:2px;border:1px solid #E2E8F0"><div style="font-size:9px;font-weight:700;color:#C62828">NHM</div></div>'
      +'<div style="text-align:center"><img src="'+PDPL+'" alt="PDPL logo" style="height:40px;width:auto;background:#fff;border-radius:8px;padding:2px;border:1px solid #E2E8F0"><div style="font-size:9px;font-weight:700;color:#475569">PDPL</div></div>';
    searchBox.parentNode.insertBefore(wrap, searchBox);
  }
  setInterval(tick,500);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', tick); else tick();
})();
